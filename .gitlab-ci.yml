# =============================================================================
# pump-evolution — build, empacotamento e publicação do vendor zip
#
# O SDK não está no npm nem no PyPI público: é distribuído como zip no S3 e
# servido pela plataforma em GET /api/sdk/download (ADR-0055/0057).
#
# Até 25/08/2026 esse zip era montado e enviado à mão. O resultado foi que o
# artefato ficou À FRENTE do repositório — havia código e documentação que só
# existiam dentro dele. Esta pipeline fecha o elo: mergeou em `main`, o zip é
# reconstruído a partir do repositório e publicado na conta.
#
# Três jobs, cada um com a ferramenta certa: Node para compilar, Python para
# montar, AWS CLI para publicar.
# =============================================================================

# Os runners deste GitLab são registrados COM tag: job sem tag não encontra
# executor e fica pendente para sempre. `eks` é o runner default do grupo, o
# mesmo que a pipeline da plataforma usa em todos os jobs.
default:
  tags:
    - eks
  retry:
    max: 2
    when: runner_system_failure

stages:
  - build
  - package
  - publish

variables:
  # Sem fixar a versão, `corepack enable` baixa o pnpm mais recente — que hoje
  # exige Node >= 22.13 e quebra na imagem node:20 com ERR_UNKNOWN_BUILTIN_MODULE
  # (node:sqlite). Mesma versão que a plataforma usa.
  PNPM_VERSION: '9.12.3'
  BUCKET: topaz-tooling-deploy-artifacts-029765331397
  AWS_REGION: us-east-1

# ── Compila o TypeScript e gera o tarball npm ────────────────────────────────
build-tarball:
  stage: build
  image: node:20-bookworm
  script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    # --frozen-lockfile: build reproduzível. Sem lockfile versionado, o CI
    # resolvia versões diferentes a cada run — foi assim que instalou
    # typescript 5.9.3 onde o package.json pede ^5.6.3.
    - pnpm install --frozen-lockfile
    - pnpm run build
    - npm pack
  artifacts:
    paths:
      - topaz-ia-pump-evolution-*.tgz
    expire_in: 1 day

# ── Monta o vendor zip a partir do repositório ───────────────────────────────
#
# `--skip-build` porque o tarball vem do job anterior. A receita confere as
# versões declaradas e falha se divergirem — publicar um artefato que mente
# sobre a própria versão atrapalha todo diagnóstico depois.
#
# A versão sai daqui como dotenv, em vez de ser extraída no shell do job de
# publicação: `sed` com backreference dentro de YAML dentro de shell já custou
# um arquivo corrompido, e não traz retorno nenhum. Aqui é uma linha de Python
# lendo o package.json.
package-zip:
  stage: package
  image: python:3.12-slim
  needs:
    - build-tarball
  script:
    - python scripts/build_vendor_zip.py --skip-build
    - python -c "import json; print('VERSAO=' + json.load(open('package.json'))['version'])" > versao.env
    - cat versao.env
  artifacts:
    paths:
      - dist-zip/pump-evolution-latest.zip
    reports:
      dotenv: versao.env
    expire_in: 1 week

# ── Publica no S3 da conta ───────────────────────────────────────────────────
#
# Sem assume-role e sem OIDC: o runner no Kubernetes já roda com credencial AWS
# anexada, e é assim que TODA a pipeline da plataforma opera — ela registra task
# definitions e faz deploy em produção chamando `aws` direto, sem configurar
# credencial nenhuma.
#
# A tentativa anterior montou federação OIDC do zero (role, trust policy,
# audiência) e falhou com InvalidIdentityToken. Era mecanismo que este ambiente
# não usa. Publicar um zip não justifica infraestrutura de identidade própria
# quando existe um caminho comprovado ao lado.
#
# Contrapartida assumida: a credencial do runner é compartilhada entre projetos
# com a tag `eks`. O OIDC amarraria a publicação a este repositório e a este
# branch; sem ele, a fronteira é a mesma que a plataforma já aceita para deploy
# em produção.
#
# Duas chaves: a versionada dá rastreabilidade e rollback; a `latest` é a que a
# API lê — o caminho é fixo em sdk.ts. A versionada sai sempre; a `latest` só
# com PROMOVER_LATEST=true, para não trocar por inércia o artefato que todo
# integrador baixa. O bucket tem versionamento ligado.
publish-s3:
  stage: publish
  image: amazon/aws-cli:latest
  needs:
    - package-zip
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if [ -z "${VERSAO}" ]; then
        echo "VERSAO nao veio do job package-zip. Sem publicar."
        exit 1
      fi
      echo "Publicando a versao ${VERSAO}"
      echo "Identidade do runner: $(aws sts get-caller-identity --query Arn --output text)"

      ZIP=dist-zip/pump-evolution-latest.zip

      aws s3 cp "$ZIP" "s3://${BUCKET}/sdk/pump-evolution-${VERSAO}.zip" --region "${AWS_REGION}"
      echo "Publicado: sdk/pump-evolution-${VERSAO}.zip"

      if [ "${PROMOVER_LATEST:-false}" = "true" ]; then
        aws s3 cp "$ZIP" "s3://${BUCKET}/sdk/pump-evolution-latest.zip" --region "${AWS_REGION}"
        echo "Promovido para sdk/pump-evolution-latest.zip"
      else
        echo "latest NAO promovida (PROMOVER_LATEST != true)."
        echo "Confira o artefato versionado e rode de novo com PROMOVER_LATEST=true para promover:"
        echo "  aws s3 cp s3://${BUCKET}/sdk/pump-evolution-${VERSAO}.zip ./novo.zip"
      fi
  environment:
    name: tooling
