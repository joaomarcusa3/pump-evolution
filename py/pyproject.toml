[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-evolution"
version = "0.0.4"
description = "Plug-and-play Python telemetry SDK for AI agents and MCP servers — emits governed usage telemetry (identity, tokens, tools, compliance, OWASP security) to Control Tower AI as OpenTelemetry GenAI spans. Python parity of @topaz-ia/pump-evolution. Zero internal cta-* dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
authors = [{ name = "Topaz IA" }]
keywords = ["opentelemetry", "genai", "bedrock", "mcp", "observability", "governance", "control-tower"]

dependencies = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-semantic-conventions>=0.49b0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.5", "types-PyYAML>=6.0"]

[project.urls]
Homepage = "https://gitlab.topazevolution.com/topaz-ia/templates/sdk"
Repository = "https://gitlab.topazevolution.com/topaz-ia/templates/sdk.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["pump_evolution*"]
